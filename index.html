<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FOREWRD STUDIO</title>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet">
  <style>
    :root { --parchment: #F4F1ED; --black: #000; --font: 'Josefin Sans', sans-serif; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    html { height: 100dvh; }
    body { font-family: var(--font); background: var(--parchment); color: var(--black); height: 100dvh; }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }

    /* NAV */
    .nav {
      position: fixed; top: 0; left: 0; right: 0;
      height: 100px;
      z-index: 100;
      background: transparent;
      pointer-events: none;
    }
    .nav > * { pointer-events: all; }

    /* ⚙️ Logo */
    .nav__logo {
      position: absolute;
      left: 1vw;
      top: 1vh; top: 1dvh;
      display: flex; align-items: center;
    }
    .nav__logo img {
      width: 24.55vw;
      max-width: 120px;
      height: auto;
    }

    .nav__links { display: none; }

    /* Hamburger */
    .nav__ham {
      position: absolute;
      right: 20px;
      top: 3vh; top: 3dvh;
      display: flex; flex-direction: column; gap: 5px; padding: 6px; z-index: 101;
    }
    .nav__ham span { width: 22px; height: 1.5px; background: var(--black); transition: all 0.3s; }
    .nav__ham.open span:nth-child(1) { transform: rotate(45deg) translate(4.5px, 4.5px); }
    .nav__ham.open span:nth-child(2) { opacity: 0; }
    .nav__ham.open span:nth-child(3) { transform: rotate(-45deg) translate(4.5px, -4.5px); }

    /* Mobile menu */
    .nav__menu {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--parchment);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 24px;
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s;
      z-index: 99;
      overflow-y: auto;
      padding: 100px 20px;
    }
    .nav__menu.open { opacity: 1; pointer-events: all; }
    .nav__menu > a, .nav__menu-item {
      font-size: 1rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--black);
    }

    /* Dropdown */
    .nav__dropdown { position: relative; text-align: center; }
    .nav__dropdown-trigger {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 1rem; letter-spacing: 0.2em; text-transform: uppercase;
      font-family: inherit; cursor: pointer; background: none; border: none;
      color: var(--black);
    }
    .nav__dropdown-menu {
      display: none;
      flex-direction: column;
      gap: 16px;
      margin-top: 20px;
      padding: 16px 0;
    }
    .nav__dropdown.open .nav__dropdown-menu { display: flex; }
    .nav__dropdown-menu a, .nav__submenu-trigger {
      font-size: 0.85rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(0,0,0,0.7);
      font-family: inherit; background: none; border: none; cursor: pointer;
      display: inline-flex; align-items: center; gap: 8px;
      justify-content: center;
    }
    .nav__submenu { position: relative; text-align: center; }
    .nav__submenu-menu {
      display: none;
      flex-direction: column;
      gap: 12px;
      margin-top: 14px;
      padding-left: 0;
    }
    .nav__submenu.open .nav__submenu-menu { display: flex; }
    .nav__submenu-menu a {
      font-size: 0.8rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(0,0,0,0.55);
    }

    /* F animation in mobile menu */
    .nav__menu-f { margin-top: 30px; display: flex; justify-content: center; }
    .nav__menu-f img { width: 80px; height: auto; }

    /* STAGE */
    .stage {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      height: 100vh; height: 100dvh;
      overflow: hidden;
      background: var(--parchment);
    }

    /* LOOK */
    .look {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      opacity: 0;
    }
    .look.active { pointer-events: all; opacity: 1; }
    .look > * { position: absolute; }

    /* ============================================
       ⚙️ MANUAL ADJUST — Image A (all looks default)
       Formula: figma_X ÷ 3.93 = vw  |  figma_Y ÷ 8.52 = vh
       ============================================ */
    .look__img-a {
      height: 64.67vh; height: 64.67dvh;
      width: auto;
      left: 50vw;
      top: 11.38vh; top: 11.38dvh;
      z-index: 1;
      transition: transform 1.5s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .look__img-a img { height: 100%; width: auto; display: block; }

    /* ⚙️ Image B (all looks default) */
    .look__img-b {
      height: 69.72vh; height: 69.72dvh;
      width: auto;
      left: -14vw;
      top: 32.87vh; top: 32.87dvh;
      z-index: 2;
      transition: transform 1.5s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .look__img-b img { height: 100%; width: auto; display: block; }

    /* ⚙️ Heading */
    .look__heading {
      cursor: pointer;
      pointer-events: auto;
      left: 5.09vw;
      top: 40vh; top: 40dvh;
      z-index: 5;
      transition: transform 1.5s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .look__number {
      font-size: 6vw;
      font-weight: 300;
      color: rgba(0,0,0,0.12);
      line-height: 1;
      margin-bottom: 2px;
    }
    .look__name {
      font-size: 5vw;
      font-weight: 400;
      color: rgba(0,0,0,0.25);
      line-height: 1.15;
    }

    /* ⚙️ Description */
    .look__desc {
      left: 48.6vw;
      top: 77.11vh; top: 77.11dvh;
      width: 47.58vw;
      z-index: 10;
      text-align: right;
      transition: transform 1.5s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .look__desc-label {
      font-size: 4.07vw;
      font-weight: 300;
      color: rgba(0,0,0,0.35);
      margin-bottom: 6px;
    }
    .look__desc-text {
      font-size: 4.07vw;
      font-weight: 300;
      line-height: 1.55;
      color: rgba(0,0,0,0.35);
      text-align: right;
    }

    /* ============================================
       ⚙️⚙️⚙️ PER-LOOK OVERRIDES ⚙️⚙️⚙️
       Change only what you want different per look
       ============================================ */

    /* --- LOOK 1 (Midnight Blue Set) --- */
    .look[data-look="0"] .look__img-b { left: 5vw; top: 32.87vh; top: 32.87dvh; height: 80vh; height: 80dvh; }
    .look[data-look="0"] .look__heading { left: 5.09vw; top: 10vh; top: 10dvh; }

    /* --- LOOK 2 (Denim Overdose) --- */
    .look[data-look="1"] .look__img-a { left: 50vw; top: 11.38vh; top: 11.38dvh; height: 64.67vh; height: 64.67dvh; }
    .look[data-look="1"] .look__img-b { left: -14vw; top: 32.87vh; top: 32.87dvh; height: 69.72vh; height: 69.72dvh; }
    .look[data-look="1"] .look__heading { left: 5.09vw; top: 10vh; top: 10dvh; }
    .look[data-look="1"] .look__desc { left: 48.6vw; top: 77.11vh; top: 77.11dvh; width: 47.58vw; }

    /* --- LOOK 3 (Bold One) --- */
    .look[data-look="2"] .look__img-a { left: 50vw; top: 11.38vh; top: 11.38dvh; height: 64.67vh; height: 64.67dvh; }
    .look[data-look="2"] .look__img-b { left: -14vw; top: 32.87vh; top: 32.87dvh; height: 69.72vh; height: 69.72dvh; }
    .look[data-look="2"] .look__heading { left: 5.09vw; top: 10vh; top: 10dvh; }
    .look[data-look="2"] .look__desc { left: 48.6vw; top: 77.11vh; top: 77.11dvh; width: 47.58vw; }

    /* --- LOOK 4 (All Black) --- */
    .look[data-look="3"] .look__img-a { left: 50vw; top: 11.38vh; top: 11.38dvh; height: 64.67vh; height: 64.67dvh; }
    .look[data-look="3"] .look__img-b { left: -14vw; top: 32.87vh; top: 32.87dvh; height: 69.72vh; height: 69.72dvh; }
    .look[data-look="3"] .look__heading { left: 5.09vw; top: 10vh; top: 10dvh; }
    .look[data-look="3"] .look__desc { left: 48.6vw; top: 77.11vh; top: 77.11dvh; width: 47.58vw; }

    /* CTA link at bottom */
    .scroll-hint {
      position: fixed;
      bottom: 8px;
      left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 7px;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #000;
      z-index: 50;
      transition: opacity 0.4s;
    }
    .scroll-hint svg { width: 14px; height: 14px; stroke: #000; fill: none; stroke-width: 1.5; animation: nudgeRight 1.5s ease-in-out infinite; }
    @keyframes nudgeRight { 0%,100% { transform: translateX(0); } 50% { transform: translateX(4px); } }

    /* Look indicator dots */
    .look-dots {
      position: fixed;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 50;
    }
    .look-dots__dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(0,0,0,0.15);
      transition: background 0.3s;
    }
    .look-dots__dot.active {
      background: rgba(0,0,0,0.6);
    }

    /* ANIMATION STATES */
    .look.active { opacity: 1; }
    .look.active .look__img-a,
    .look.active .look__img-b,
    .look.active .look__heading,
    .look.active .look__desc { transform: translateX(0); }

    .look.exit-left, .look.exit-right,
    .look.enter-left, .look.enter-right { opacity: 1; }

    .look.exit-left .look__heading,
    .look.exit-left .look__img-a,
    .look.exit-left .look__desc { transform: translateX(-110vw); }
    .look.exit-left .look__img-b { transform: translateX(110vw); }

    .look.enter-right .look__heading,
    .look.enter-right .look__img-a,
    .look.enter-right .look__desc { transform: translateX(110vw); }
    .look.enter-right .look__img-b { transform: translateX(-110vw); }

    .look.exit-right .look__heading,
    .look.exit-right .look__img-a,
    .look.exit-right .look__desc { transform: translateX(110vw); }
    .look.exit-right .look__img-b { transform: translateX(-110vw); }

    .look.enter-left .look__heading,
    .look.enter-left .look__img-a,
    .look.enter-left .look__desc { transform: translateX(-110vw); }
    .look.enter-left .look__img-b { transform: translateX(110vw); }

    .look.no-transition * { transition: none !important; }

    /* --- Dropdown chevron --- */
    .nav__dropdown-arrow {
      width: 7px; height: 7px;
      border-right: 1.5px solid currentColor;
      border-bottom: 1.5px solid currentColor;
      display: inline-block;
      transform: rotate(45deg);
      transform-origin: center;
      transition: transform 0.3s ease;
      margin-bottom: 3px;
      flex-shrink: 0;
    }
    .nav__dropdown.open > .nav__dropdown-trigger > .nav__dropdown-arrow { transform: rotate(-135deg); margin-bottom: 0; }
    .nav__submenu.open  > .nav__submenu-trigger  > .nav__dropdown-arrow { transform: rotate(-135deg); margin-bottom: 0; }

    /* --- Micro-interaction --- */
    .nav__menu a,
    .nav__dropdown-trigger,
    .nav__submenu-trigger,
    .nav__ham,
    .nav__dropdown-menu a,
    .nav__submenu-menu a {
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      transition: opacity 0.18s ease, transform 0.18s ease, letter-spacing 0.25s ease;
    }
    .nav__menu a:active,
    .nav__dropdown-trigger:active,
    .nav__submenu-trigger:active {
      opacity: 0.55;
      transform: scale(0.96);
    }
    @media (hover: hover) {
      .nav__menu a:hover,
      .nav__dropdown-trigger:hover,
      .nav__submenu-trigger:hover { letter-spacing: 0.26em; opacity: 0.7; }
      .nav__submenu-trigger:hover { letter-spacing: 0.2em; }
    }

    /* ============================================
       ⚙️ DESKTOP OVERRIDES (1024px and wider)
       Only affects laptop/desktop — phone layout untouched.
       Change the numbers to match your desktop Figma.
       ============================================ */
    @media (min-width: 1024px) {
      .look__img-a { left: 55vw; top: 8vh; top: 8dvh; height: 75vh; height: 75dvh; }
      .look__img-b { left: 2vw; top: 20vh; top: 20dvh; height: 72vh; height: 72dvh; }
      .look__heading { left: 5vw; top: 12vh; top: 12dvh; }
      .look__number { font-size: 4vw; }
      .look__name { font-size: 3.5vw; }

      /* Look 1 only — desktop */
      .look[data-look="0"] .look__img-b { left: 5vw; top: 15vh; top: 15dvh; height: 85vh; height: 85dvh; }
      .look[data-look="0"] .look__heading { left: 4vw; top: 8vh; top: 8dvh; }
    }
  </style>

<body>

  <!-- NAV -->
  <nav class="nav">
    <a href="index.html" class="nav__logo"><img src="assets/logo/Forewrd_Studio_black.svg" alt="FOREWRD"></a>
    <button class="nav__ham" id="ham"><span></span><span></span><span></span></button>
  </nav>

  <!-- Mobile menu -->
  <div class="nav__menu" id="mob">
    <div class="nav__dropdown" id="dropdown">
      <button class="nav__dropdown-trigger" onclick="toggleDropdown()">
        Collection
        <span class="nav__dropdown-arrow"></span>
      </button>
      <div class="nav__dropdown-menu">
        <a href="collection.html">The Opening Act — Issue: 001</a>
        <div class="nav__submenu" id="submenu">
          <button class="nav__submenu-trigger" onclick="toggleSubmenu(event)">
            Category
            <span class="nav__dropdown-arrow"></span>
          </button>
          <div class="nav__submenu-menu">
            <a href="collection.html#tops">Tops</a>
            <a href="collection.html#bottoms">Bottoms</a>
            <a href="collection.html#jackets">Jackets</a>
            <a href="collection.html#jewellery">Fine Jewellery</a>
            <a href="collection.html#accessories">Accessories</a>
          </div>
        </div>
      </div>
    </div>
    <a href="size-guide.html">Size Guide</a>
    <a href="story.html">Story</a>
    <a href="contact.html">Contact</a>
    <div class="nav__menu-f"><img src="assets/logo/f_animated.webp" alt="F"></div>
  </div>

  <!-- STAGE -->
  <div class="stage" id="stage">

    <!-- LOOK 1: Midnight Blue Set -->
    <div class="look active" data-look="0">
      <a class="look__heading" href="collection.html#look-1">
        <div class="look__number">01</div>
        <div class="look__name">Midnight<br>Blue<br>Set</div>
      </a>
      <div class="look__img-b"><img src="assets/looks/look-1-b.png" alt="Midnight Blue Set detail"></div>
    </div>

    <!-- LOOK 2: Denim Overdose -->
    <div class="look enter-right no-transition" data-look="1">
      <a class="look__heading" href="collection.html#look-2">
        <div class="look__number">02</div>
        <div class="look__name">Cropped Denim Jacket<br>& Denim Zipper Skirt</div>
      </a>
      <div class="look__img-a"><img src="assets/looks/look-2-a.png" alt="Denim Overdose"></div>
      <div class="look__img-b"><img src="assets/looks/look-2-b.png" alt="Denim Overdose detail"></div>
    </div>

    <!-- LOOK 3: Bold One -->
    <div class="look enter-right no-transition" data-look="2">
      <a class="look__heading" href="collection.html#look-6">
        <div class="look__number">03</div>
        <div class="look__name">Assymentrical Peplum<br>Corset &<br>Cherry Brown Jorts</div>
      </a>
      <div class="look__img-a"><img src="assets/looks/look-3-a.png" alt="Bold One"></div>
      <div class="look__img-b"><img src="assets/looks/look-3-b.png" alt="Bold One detail"></div>
    </div>

    <!-- LOOK 4: All Black -->
    <div class="look enter-right no-transition" data-look="3">
      <a class="look__heading" href="collection.html#look-7">
        <div class="look__number">04</div>
        <div class="look__name">Assymentrical Peplum<br>Corset &<br>Harem Pants</div>
      </a>
      <div class="look__img-a"><img src="assets/looks/look-4-a.png" alt="All Black"></div>
      <div class="look__img-b"><img src="assets/looks/look-4-b.png" alt="All Black detail"></div>
    </div>

  </div>

  <!-- Look indicator dots -->
  <div class="look-dots" id="lookDots">
    <span class="look-dots__dot active" data-idx="0"></span>
    <span class="look-dots__dot" data-idx="1"></span>
    <span class="look-dots__dot" data-idx="2"></span>
    <span class="look-dots__dot" data-idx="3"></span>
  </div>

  <!-- Collection CTA -->
  <a href="collection.html" class="scroll-hint" id="hint">
    <span>Explore the full collection</span>
    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
  </a>

  <script>
    /* NAV MENU */
    var ham = document.getElementById('ham'), mob = document.getElementById('mob');
    ham.addEventListener('click', function() {
      ham.classList.toggle('open');
      mob.classList.toggle('open');
    });
    mob.querySelectorAll('a').forEach(function(a) {
      a.addEventListener('click', function() {
        ham.classList.remove('open');
        mob.classList.remove('open');
      });
    });

    /* DROPDOWN */
    function toggleDropdown() {
      document.getElementById('dropdown').classList.toggle('open');
    }
    function toggleSubmenu(e) {
      e.stopPropagation();
      document.getElementById('submenu').classList.toggle('open');
    }

    /* SWIPER — vertical scroll triggers horizontal transition, loops back to 1 after 4.
       No wait-lock: you can keep swiping and it advances immediately. */
    var looks = document.querySelectorAll('.look');
    var dots = document.querySelectorAll('.look-dots__dot');
    var current = 0;
    var total = looks.length;

    function goTo(next) {
      if (next >= total) next = 0;
      if (next < 0) next = total - 1;
      if (next === current) return;

      var goingForward;
      if (current === total - 1 && next === 0) goingForward = true;
      else if (current === 0 && next === total - 1) goingForward = false;
      else goingForward = next > current;

      var cur = looks[current];
      var nxt = looks[next];

      cur.classList.remove('active');
      cur.classList.add(goingForward ? 'exit-left' : 'exit-right');

      nxt.classList.add('no-transition');
      nxt.classList.remove('enter-right', 'enter-left', 'exit-left', 'exit-right', 'active');
      nxt.classList.add(goingForward ? 'enter-right' : 'enter-left');

      nxt.offsetHeight;

      nxt.classList.remove('no-transition');
      nxt.classList.remove('enter-right', 'enter-left');
      nxt.classList.add('active');

      dots.forEach(function(d, i) { d.classList.toggle('active', i === next); });

      current = next;

      /* Clean up the just-exited slide after its transition, without blocking input */
      (function(exited){
        setTimeout(function() {
          if (!exited.classList.contains('active')) exited.classList.remove('exit-left', 'exit-right');
        }, 1550);
      })(cur);
    }

    /* VERTICAL SCROLL → triggers horizontal transition.
       Small cooldown so one scroll gesture advances exactly one look,
       but you never have to wait for the animation to finish. */
    var wheelTimer, wheelReady = true, wheelAccum = 0;
    window.addEventListener('wheel', function(e) {
      e.preventDefault();
      wheelAccum += e.deltaY;
      if (wheelReady && Math.abs(wheelAccum) > 40) {
        goTo(current + (wheelAccum > 0 ? 1 : -1));
        wheelAccum = 0;
        wheelReady = false;
        setTimeout(function(){ wheelReady = true; }, 260);
      }
      clearTimeout(wheelTimer);
      wheelTimer = setTimeout(function() { wheelAccum = 0; }, 150);
    }, { passive: false });

    /* TOUCH — vertical swipe */
    var touchStartY = 0, touchDiffY = 0;
    var stage = document.getElementById('stage');

    stage.addEventListener('touchstart', function(e) {
      touchStartY = e.touches[0].clientY;
      touchDiffY = 0;
    }, { passive: true });

    stage.addEventListener('touchmove', function(e) {
      touchDiffY = touchStartY - e.touches[0].clientY;
      e.preventDefault();
    }, { passive: false });

    stage.addEventListener('touchend', function() {
      if (Math.abs(touchDiffY) > 50) {
        if (touchDiffY > 0) goTo(current + 1);
        else goTo(current - 1);
      }
      touchDiffY = 0;
    }, { passive: true });

    /* KEYBOARD */
    document.addEventListener('keydown', function(e) {
      if (e.key === 'ArrowDown' || e.key === 'PageDown') goTo(current + 1);
      if (e.key === 'ArrowUp' || e.key === 'PageUp') goTo(current - 1);
    });

    /* Click dots to jump */
    dots.forEach(function(d) {
      d.addEventListener('click', function() { goTo(parseInt(d.dataset.idx)); });
    });
  </script>
